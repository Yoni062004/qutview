name: CI

# master auto-deploys to Streamlit Community Cloud, so this is the gate that
# runs before a broken commit can reach the live app.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Bump deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=src --cov-report=term

      - name: Dashboard compile + headless render
        run: python scripts/ci_check_dashboard.py
